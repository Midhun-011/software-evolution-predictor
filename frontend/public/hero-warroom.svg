<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Software engineering war room with monitoring screens and analytics">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="0.45" stop-color="#0b1638"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.7" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1c46"/>
      <stop offset="1" stop-color="#10204f"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="areaFill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- ambient light blooms -->
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowPurple)"/>
  <ellipse cx="800" cy="430" rx="520" ry="300" fill="url(#glowCyan)" opacity="0.4"/>

  <!-- perspective floor grid -->
  <g stroke="#1d8fe1" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="800" y1="620" x2="-400" y2="900"/>
    <line x1="800" y1="620" x2="180" y2="900"/>
    <line x1="800" y1="620" x2="520" y2="900"/>
    <line x1="800" y1="620" x2="800" y2="900"/>
    <line x1="800" y1="620" x2="1080" y2="900"/>
    <line x1="800" y1="620" x2="1420" y2="900"/>
    <line x1="800" y1="620" x2="2000" y2="900"/>
    <line x1="0" y1="660" x2="1600" y2="660"/>
    <line x1="-40" y1="710" x2="1640" y2="710"/>
    <line x1="-90" y1="775" x2="1690" y2="775"/>
    <line x1="-160" y1="850" x2="1760" y2="850"/>
  </g>

  <!-- big central video wall -->
  <g>
    <rect x="560" y="150" width="480" height="270" rx="10" fill="#060b1c" stroke="#2b4ea8" stroke-opacity="0.5"/>
    <rect x="572" y="162" width="456" height="246" rx="6" fill="url(#screen)"/>
    <!-- world-ish dots -->
    <g fill="#38bdf8" opacity="0.8">
      <circle cx="640" cy="230" r="3"/><circle cx="690" cy="250" r="3"/><circle cx="760" cy="220" r="3"/>
      <circle cx="820" cy="270" r="3"/><circle cx="890" cy="240" r="3"/><circle cx="950" cy="290" r="3"/>
      <circle cx="700" cy="320" r="3"/><circle cx="800" cy="350" r="3"/><circle cx="880" cy="330" r="3"/>
    </g>
    <g stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.4" fill="none">
      <path d="M640 230 L760 220 L890 240 L950 290"/>
      <path d="M700 320 L800 350 L880 330"/>
    </g>
    <!-- area chart -->
    <path d="M590 390 L640 350 L690 365 L740 320 L790 340 L840 295 L890 315 L940 280 L990 300 L1010 300 L1010 400 L590 400 Z" fill="url(#areaFill)"/>
    <path d="M590 390 L640 350 L690 365 L740 320 L790 340 L840 295 L890 315 L940 280 L990 300" fill="none" stroke="#7dd3fc" stroke-width="2"/>
  </g>

  <!-- left monitor cluster -->
  <g transform="translate(180 210) skewY(6)">
    <rect x="0" y="0" width="300" height="190" rx="8" fill="#060b1c" stroke="#2b4ea8" stroke-opacity="0.5"/>
    <rect x="10" y="10" width="280" height="170" rx="5" fill="url(#screen)"/>
    <path d="M20 170 L20 120 L60 95 L100 130 L140 80 L180 110 L220 70 L260 100 L280 100 L280 180 L20 180 Z" fill="url(#areaFill2)"/>
    <path d="M20 120 L60 95 L100 130 L140 80 L180 110 L220 70 L260 100" fill="none" stroke="#c4b5fd" stroke-width="2"/>
  </g>
  <g transform="translate(150 430) skewY(4)">
    <rect x="0" y="0" width="240" height="150" rx="8" fill="#060b1c" stroke="#2b4ea8" stroke-opacity="0.45"/>
    <rect x="8" y="8" width="224" height="134" rx="5" fill="url(#screen)"/>
    <g fill="#22d3ee" opacity="0.85">
      <rect x="24" y="92" width="22" height="42" rx="3"/>
      <rect x="58" y="70" width="22" height="64" rx="3"/>
      <rect x="92" y="100" width="22" height="34" rx="3"/>
      <rect x="126" y="56" width="22" height="78" rx="3"/>
      <rect x="160" y="84" width="22" height="50" rx="3"/>
      <rect x="194" y="48" width="22" height="86" rx="3"/>
    </g>
  </g>

  <!-- right monitor cluster -->
  <g transform="translate(1130 210) skewY(-6)">
    <rect x="0" y="0" width="300" height="190" rx="8" fill="#060b1c" stroke="#2b4ea8" stroke-opacity="0.5"/>
    <rect x="10" y="10" width="280" height="170" rx="5" fill="url(#screen)"/>
    <circle cx="150" cy="95" r="62" fill="none" stroke="#1e3a8a" stroke-width="16"/>
    <circle cx="150" cy="95" r="62" fill="none" stroke="#38bdf8" stroke-width="16" stroke-dasharray="240 400" stroke-linecap="round" transform="rotate(-90 150 95)"/>
    <circle cx="150" cy="95" r="62" fill="none" stroke="#a78bfa" stroke-width="16" stroke-dasharray="120 400" stroke-dashoffset="-240" stroke-linecap="round" transform="rotate(-90 150 95)"/>
  </g>
  <g transform="translate(1210 430) skewY(-4)">
    <rect x="0" y="0" width="240" height="150" rx="8" fill="#060b1c" stroke="#2b4ea8" stroke-opacity="0.45"/>
    <rect x="8" y="8" width="224" height="134" rx="5" fill="url(#screen)"/>
    <g font-family="monospace" font-size="11" fill="#5eead4" opacity="0.85">
      <text x="22" y="40">$ git log --evolution</text>
      <text x="22" y="62">+ commit a93f health 92</text>
      <text x="22" y="84">+ risk: low  cov: 87%</text>
      <text x="22" y="106">~ predict next release</text>
      <text x="22" y="126">&gt; stable trend ↑</text>
    </g>
  </g>

  <!-- developer silhouettes -->
  <g fill="#05080f" opacity="0.92">
    <g transform="translate(470 560)">
      <circle cx="0" cy="0" r="34"/>
      <path d="M-58 150 Q-58 40 0 40 Q58 40 58 150 Z"/>
    </g>
    <g transform="translate(640 600)">
      <circle cx="0" cy="0" r="30"/>
      <path d="M-52 150 Q-52 38 0 38 Q52 38 52 150 Z"/>
    </g>
    <g transform="translate(960 600)">
      <circle cx="0" cy="0" r="30"/>
      <path d="M-52 150 Q-52 38 0 38 Q52 38 52 150 Z"/>
    </g>
    <g transform="translate(1130 560)">
      <circle cx="0" cy="0" r="34"/>
      <path d="M-58 150 Q-58 40 0 40 Q58 40 58 150 Z"/>
    </g>
  </g>
  <!-- rim light on silhouettes -->
  <g stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M438 588 Q418 600 412 660"/>
    <path d="M1162 588 Q1182 600 1188 660"/>
  </g>
  <g stroke="#a78bfa" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M612 630 Q598 640 594 690"/>
    <path d="M988 630 Q1002 640 1006 690"/>
  </g>

  <!-- desk light strip -->
  <rect x="380" y="690" width="840" height="6" rx="3" fill="#38bdf8" opacity="0.4" filter="url(#soft)"/>

  <!-- floating data particles -->
  <g fill="#7dd3fc">
    <circle cx="320" cy="140" r="2.5" opacity="0.7"/>
    <circle cx="1280" cy="120" r="2.5" opacity="0.7"/>
    <circle cx="540" cy="90" r="2" opacity="0.6"/>
    <circle cx="1080" cy="80" r="2" opacity="0.6"/>
    <circle cx="800" cy="60" r="2" opacity="0.6"/>
    <circle cx="240" cy="360" r="2" opacity="0.5"/>
    <circle cx="1370" cy="350" r="2" opacity="0.5"/>
  </g>

  <!-- top + bottom vignette toward theme bg -->
  <rect width="1600" height="220" fill="#070b16" opacity="0.45"/>
  <rect y="700" width="1600" height="200" fill="#070b16" opacity="0.55"/>
</svg>
